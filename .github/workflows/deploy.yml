name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Deploy to GitHub Pages
        run: |
          git config --global user.email "csiddiqui@gmail.com"
          git config --global user.name "carthasiddiqui"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/carthasiddiqui/Workout.git
          npm run deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
